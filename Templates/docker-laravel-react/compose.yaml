name: laravel-react-dev

services:
  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        APP_USER: app
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: ${PHP_IMAGE:-taii0401/laravel-php:8.4}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - app_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - application

  api-nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx-api/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_network
    depends_on:
      - api
    profiles:
      - application

  web:
    image: node:22-alpine
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
    networks:
      - app_network
    profiles:
      - application

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${MYSQL_FORWARD_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-app}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      TZ: Asia/Taipei
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "${REDIS_FORWARD_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - app_network

  queue:
    image: ${PHP_IMAGE:-taii0401/laravel-php:8.4}
    restart: unless-stopped
    working_dir: /var/www/html
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --sleep=3
      - --tries=3
      - --timeout=120
    volumes:
      - ./backend:/var/www/html
    networks:
      - app_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - application

  scheduler:
    image: ${PHP_IMAGE:-taii0401/laravel-php:8.4}
    restart: unless-stopped
    working_dir: /var/www/html
    command:
      - php
      - artisan
      - schedule:work
    volumes:
      - ./backend:/var/www/html
    networks:
      - app_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - application

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
